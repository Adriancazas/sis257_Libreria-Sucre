<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Librería SIS257</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-libreria sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#"><i class="bi bi-book-half me-2"></i>Librería SIS257</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto" id="nav-secciones"></ul>
      </div>
    </div>
  </nav>

  <header class="hero text-center text-white py-4">
    <div class="container">
      <h1 class="h3 mb-1">Gestión y ventas de libros</h1>
      <p class="mb-0 opacity-75">Catálogos de categorías, autores y libros, y registro de ventas</p>
    </div>
  </header>

  <main class="container my-4">
    <div id="alerta" class="alert d-none" role="alert"></div>
    <section id="seccion"></section>
  </main>

  <footer class="text-center text-muted small py-4">SIS257 · Proyecto de laboratorio · Backend NestJS + Frontend Bootstrap</footer>

  <!-- Modal genérico para crear / editar -->
  <div class="modal fade" id="modalForm" tabindex="-1">
    <div class="modal-dialog">
      <form class="modal-content" id="formulario">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitulo"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="modalCampos"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-libreria">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/catalogos.js"></script>
  <script src="js/ventas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
